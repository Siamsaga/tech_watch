services:

  postgres:
    image: postgres:16

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

  freshrss:

    image: freshrss/freshrss

    restart: unless-stopped

    labels:
      - traefik.enable=true
      - traefik.http.routers.rss.rule=Host(`rss.${DOMAIN}`)
      - traefik.http.routers.rss.tls.certresolver=le

    volumes:
      - ./freshrss:/var/www/FreshRSS/data

  n8n:

    image: docker.n8n.io/n8nio/n8n

    restart: unless-stopped

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      NODE_FUNCTION_ALLOW_BUILTIN: fs,path
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: true

    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN}`)
      - traefik.http.routers.n8n.tls.certresolver=le

    depends_on:
      - postgres

    volumes:
      - ./n8n:/home/node/.n8n
      - /opt/tech_watch/website/site:/site

  portainer:

    image: portainer/portainer-ce

    restart: unless-stopped

    command: -H unix:///var/run/docker.sock

    labels:
      - traefik.enable=true

      - traefik.http.routers.portainer.rule=Host("portainer.${DOMAIN}")
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls=true
      - traefik.http.routers.portainer.tls.certresolver=le

      - traefik.http.services.portainer.loadbalancer.server.port=9000

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  hugo:

    image: nginx:alpine

    restart: unless-stopped

    labels:
      - traefik.enable=true
      - traefik.http.routers.site.rule=Host(`watch.${DOMAIN}`)
      - traefik.http.routers.site.tls.certresolver=le

    volumes:
      #- /opt/tech_watch/website/site:/usr/share/nginx/html
      - ./public:/usr/share/nginx/html
  traefik:

    image: traefik:v3

    restart: unless-stopped

    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web

    labels:
    - traefik.enable=true

    - traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)
    - traefik.http.routers.dashboard.entrypoints=websecure
    - traefik.http.routers.dashboard.tls=true
    - traefik.http.routers.dashboard.tls.certresolver=le

    - traefik.http.routers.dashboard.service=api@internal

    - traefik.http.middlewares.dashboard-auth.basicauth.users=siamsaga:$2y$05$1DVAXGk6lHws177qUKPHGOwX7m.a6aQNIF4hDal3Btqz7ff9IpM/u

    - traefik.http.routers.dashboard.middlewares=dashboard-auth

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./letsencrypt:/letsencrypt


  grafana:
    image: grafana/grafana
    restart: unless-stopped

    labels:
      - traefik.enable=true

      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.tls.certresolver=le

      - traefik.http.services.grafana.loadbalancer.server.port=3000

    volumes:
      - ./grafana:/var/lib/grafana

  mongodb:
    image: mongo:7
    restart: unless-stopped

    volumes:
      - ./mongodb:/data/db

  librechat:

    image: ghcr.io/danny-avila/librechat:latest

    restart: unless-stopped

    depends_on:
      - mongodb

    environment:
      HOST: 0.0.0.0
      PORT: 3080

      MONGO_URI: mongodb://mongodb:27017/LibreChat

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_KEY: ${OPENROUTER_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

    labels:
      - traefik.enable=true

      - traefik.http.routers.librechat.rule=Host(`chat.${DOMAIN}`)
      - traefik.http.routers.librechat.entrypoints=websecure
      - traefik.http.routers.librechat.tls=true
      - traefik.http.routers.librechat.tls.certresolver=le

      - traefik.http.services.librechat.loadbalancer.server.port=3080

    volumes:
      - ./librechat/images:/app/client/public/images
      - ./librechat/uploads:/app/uploads
volumes:

  portainer_data:
