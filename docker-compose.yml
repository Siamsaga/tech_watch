services:

  postgres:
    image: postgres:16

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

  freshrss:

    image: freshrss/freshrss

    restart: unless-stopped

    labels:
      - traefik.enable=true
      - traefik.http.routers.rss.rule=Host(`rss.${DOMAIN}`)
      - traefik.http.routers.rss.tls.certresolver=le

    volumes:
      - ./freshrss:/var/www/FreshRSS/data

  n8n:

    image: docker.n8n.io/n8nio/n8n

    restart: unless-stopped

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      NODE_FUNCTION_ALLOW_BUILTIN: fs,path
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: true

    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN}`)
      - traefik.http.routers.n8n.tls.certresolver=le

    depends_on:
      - postgres

    volumes:
      - ./n8n:/home/node/.n8n
      - /opt/tech_watch/website/site:/site

  portainer:

    image: portainer/portainer-ce

    restart: unless-stopped

    command: -H unix:///var/run/docker.sock

    labels:
      - traefik.enable=true

      - traefik.http.routers.portainer.rule=Host("portainer.${DOMAIN}")
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls=true
      - traefik.http.routers.portainer.tls.certresolver=le

      - traefik.http.services.portainer.loadbalancer.server.port=9000

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  hugo:

    image: nginx:alpine

    restart: unless-stopped

    labels:
      - traefik.enable=true
      - traefik.http.routers.site.rule=Host(`watch.${DOMAIN}`)
      - traefik.http.routers.site.tls.certresolver=le

    volumes:
      #- /opt/tech_watch/website/site:/usr/share/nginx/html
      - ./public:/usr/share/nginx/html
  traefik:

    image: traefik:v3

    restart: unless-stopped

    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web

    labels:
    - traefik.enable=true

    - traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)
    - traefik.http.routers.dashboard.entrypoints=websecure
    - traefik.http.routers.dashboard.tls=true
    - traefik.http.routers.dashboard.tls.certresolver=le

    - traefik.http.routers.dashboard.service=api@internal

    - traefik.http.middlewares.dashboard-auth.basicauth.users=siamsaga:$2y$05$1DVAXGk6lHws177qUKPHGOwX7m.a6aQNIF4hDal3Btqz7ff9IpM/u

    - traefik.http.routers.dashboard.middlewares=dashboard-auth

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./letsencrypt:/letsencrypt


  grafana:
    image: grafana/grafana
    restart: unless-stopped

    labels:
      - traefik.enable=true

      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.tls.certresolver=le

      - traefik.http.services.grafana.loadbalancer.server.port=3000

    volumes:
      - ./grafana:/var/lib/grafana

  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./mongodb:/data/db
    networks:
      - librechat_network

  summarizer:
    image: ghcr.io/huggingface/text-generation-inference:1.4.3
    container_name: librechat-summarizer
    restart: unless-stopped
    environment:
      MODEL_ID: google/flan-t5-base
      MAX_INPUT_LENGTH: 2048
      MAX_TOTAL_TOKENS: 512
    ports:
      - "8080:80"
    volumes:
      - summarizer_cache:/data
    networks:
      - librechat_network
      
  librechat:
    image: ghcr.io/danny-avila/librechat:latest  # Image officielle (évite les bugs)
    container_name: librechat
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_started  # MongoDB démarre vite avec --auth
      rag_api:
        condition: service_started
      summarizer:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/LibreChat?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      OPENROUTER_KEY: ${OPENROUTER_KEY}
      SUMMARIZER_URL: http://summarizer:80/generate
      MAX_FILE_SIZE: 20  # 20 Mo (corrige AMOUT)
      UPLOAD_DIR: /app/client/public/uploads
      ALLOWED_FILE_TYPES: png,jpeg,jpg,gif,webp,pdf
      # Activer stockage S3 (optionnel pour gros volumes)
      FILE_STORAGE: local  # ou "s3" si besoin
        #ALLOW_REGISTRATION: "true"
      ALLOW_EMAIL_LOGIN: "true"
      RAG_API_URL: http://rag_api:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.librechat.rule=Host(`chat.${DOMAIN}`)
      - traefik.http.routers.librechat.entrypoints=websecure
      - traefik.http.routers.librechat.tls=true
      - traefik.http.routers.librechat.tls.certresolver=le
    volumes:
      - ./librechat/librechat_images:/app/client/public/images:rw
      - ./librechat/librechat_uploads:/app/client/public/uploads:rw
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
    networks:
      - librechat_network


  rag_api:
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest
    restart: unless-stopped
    environment:
      RAG_API_URL: http://rag_api:8000
      RAG_OPENAI_API_KEY: ${RAG_OPENAI_API_KEY}
      EMBEDDINGS_PROVIDER: openai
    ports:
      - "8000:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rag_api.rule=Host(`votre-domaine`) && PathPrefix(`/api/rag`)"
      - "traefik.http.services.rag_api.loadbalancer.server.port=8000"
    volumes:
      - ./rag_data:/data
    networks:
      - librechat_network


volumes:

  portainer_data:
  mongodb_data:
  rag_data:
  summarizer_cache:

networks:
  librechat_network:
    driver: bridge